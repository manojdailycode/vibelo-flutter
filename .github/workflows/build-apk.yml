name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup google-services.json
        run: |
          if [ -n "${{ secrets.FIREBASE_CONFIG_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG_BASE64 }}" | base64 --decode > android/app/google-services.json
            echo "Firebase config set"
          else
            cat > android/app/google-services.json << 'EOF'
            {"project_info":{"project_number":"0","project_id":"vibelo-placeholder","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.vibelo.app"}},"oauth_client":[],"api_key":[],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
            EOF
            echo "Using placeholder Firebase config"
          fi

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vibelo-release.keystore
            cat > android/key.properties << EOF
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyPassword=${{ secrets.KEY_PASSWORD }}
            keyAlias=${{ secrets.KEY_ALIAS }}
            storeFile=vibelo-release.keystore
            EOF
            echo "Real keystore configured"
          else
            echo "No keystore — using debug signing"
          fi

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }} \
            --dart-define=JIOSAAVN_BASE_URL=${{ secrets.JIOSAAVN_BASE_URL }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Vibelo-v${{ env.VERSION }}.apk

      - name: Delete Old Release
        run: gh release delete "v${{ env.VERSION }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Vibelo v${{ env.VERSION }}
          body: |
            ## Vibelo v${{ env.VERSION }}
            Download the APK below and install on Android 6.0+
          files: build/app/outputs/flutter-apk/Vibelo-v${{ env.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}