name: vibelo
description: Vibelo - Stream. Discover. Vibe.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio
  just_audio: ^0.9.40
  audio_service: ^0.18.14

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0

  # Google Sign In
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Network & Images
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # Local Storage
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.4.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
